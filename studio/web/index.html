<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RVClaw EdgeOne Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #64748b;
      --line: #d7dde6;
      --panel: #ffffff;
      --bg: #eef2f6;
      --accent: #b91c1c;
      --ok: #15803d;
      --warn: #ca8a04;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.ok {
      background: var(--ok);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(360px, 0.75fr);
      gap: 18px;
      padding: 18px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .section-title h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    button,
    .report-button {
      border: 1px solid #991b1b;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled,
    .report-button[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .image-stage {
      min-height: 560px;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #0f172a;
    }

    .image-stage img {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #111827;
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 82px;
      background: #f8fafc;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric strong {
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    pre {
      margin: 0;
      padding: 16px;
      max-height: 380px;
      overflow: auto;
      background: #111827;
      color: #e5e7eb;
      font-size: 12px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RVClaw EdgeOne Studio</h1>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Waiting for local K3 sample flow</span></div>
    </div>
    <div class="actions">
      <button id="run-button" type="button">Run Sample Flow</button>
      <a id="report-link" class="report-button" aria-disabled="true" href="#">Open Report</a>
    </div>
  </header>

  <main>
    <section>
      <div class="section-title">
        <h2>Annotated Image</h2>
        <span id="run-id">No run yet</span>
      </div>
      <div class="image-stage">
        <img id="annotated-image" alt="Annotated RVClaw inspection result">
      </div>
    </section>

    <div class="side">
      <section>
        <div class="section-title">
          <h2>Inspection Summary</h2>
        </div>
        <div class="summary">
          <div class="metric"><span>Point</span><strong id="point-id">--</strong></div>
          <div class="metric"><span>Category</span><strong id="category">--</strong></div>
          <div class="metric"><span>Value</span><strong id="value">--</strong></div>
          <div class="metric"><span>Status</span><strong id="result-status">--</strong></div>
        </div>
      </section>

      <section>
        <div class="section-title">
          <h2>Structured JSON</h2>
        </div>
        <pre id="json-output">{}</pre>
      </section>
    </div>
  </main>

  <script>
    const runButton = document.getElementById('run-button');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const annotatedImage = document.getElementById('annotated-image');
    const jsonOutput = document.getElementById('json-output');
    const reportLink = document.getElementById('report-link');

    function setLoading(isLoading) {
      runButton.disabled = isLoading;
      statusText.textContent = isLoading ? 'Running local K3 sample flow' : 'Ready';
    }

    function renderPayload(payload) {
      const inspection = payload.inspection;
      document.getElementById('run-id').textContent = payload.run.run_id;
      document.getElementById('point-id').textContent = inspection.point_id;
      document.getElementById('category').textContent = inspection.category;
      document.getElementById('value').textContent = inspection.value;
      document.getElementById('result-status').textContent = inspection.is_anomaly ? 'ANOMALY' : 'OK';
      annotatedImage.src = payload.artifacts.annotated_image_url;
      jsonOutput.textContent = JSON.stringify(payload, null, 2);
      reportLink.href = payload.artifacts.report_url;
      reportLink.removeAttribute('aria-disabled');
      statusDot.classList.add('ok');
      statusText.textContent = 'Sample flow completed';
    }

    async function runSampleFlow() {
      setLoading(true);
      try {
        const response = await fetch('/api/sample-flow');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        renderPayload(await response.json());
      } catch (error) {
        statusDot.classList.remove('ok');
        statusText.textContent = `Sample flow failed: ${error.message}`;
      } finally {
        setLoading(false);
      }
    }

    runButton.addEventListener('click', runSampleFlow);
    runSampleFlow();
  </script>
</body>
</html>
