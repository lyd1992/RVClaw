rvclaw_ekf:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.20
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    print_diagnostics: true
    debug: false
    publish_acceleration: false
    publish_tf: true
    reset_on_time_jump: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # The STM32 node currently provides calibrated-frame velocity only. Its
    # integrated pose and raw IMU remain excluded until motion calibration.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    use_control: false
