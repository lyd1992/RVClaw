bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker, position_goal_checker, origin_goal_checker]
    # Mapping and frontier goals care about reaching the safe position; the
    # explicit default prevents Nav2 Humble from selecting an empty checker.
    current_goal_checker: position_goal_checker
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.15
      stateful: true
    position_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    origin_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.25
      # Recheck XY while returning to the final heading. A scan-view change
      # must not let an old XY arrival make a displaced final pose succeed.
      stateful: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      # Ordinary path following is forward-only. Reverse is admitted solely by
      # the separately gated bounded BackUp action.
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.20
      max_vel_y: 0.0
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 0.60
      decel_lim_x: -0.20
      decel_lim_y: 0.0
      decel_lim_theta: -0.60
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.20
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.15440, -0.12725], [-0.15440, 0.12725], [0.15275, 0.12725], [0.15275, -0.12725]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.15
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: "[[-0.15440, -0.12725], [-0.15440, 0.12725], [0.15275, 0.12725], [0.15275, -0.12725]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.15
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.10
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.60

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: rvclaw/nav2_cmd_vel_raw
    cmd_vel_out_topic: rvclaw/nav2_cmd_vel
    transform_tolerance: 0.20
    source_timeout: 0.30
    base_shift_correction: true
    # Keep STOP output for the bounded route while input callbacks continue.
    # A blocked route is not a lost command stream. CollisionMonitor still
    # publishes nothing when its upstream producer disappears, so the command
    # adapter's existing two-second gap limit and hardware deadman remain.
    stop_pub_timeout: 600.0
    # Ordinary navigation uses front_stop/front_slow.  side_near_stop is a
    # temporary, fail-closed profile used only by the bounded side-near egress
    # action and is disabled by default.
    polygons: [front_stop, front_slow, side_near_stop]
    front_stop:
      type: polygon
      points: [0.0, 0.17, 0.35, 0.17, 0.35, -0.17, 0.0, -0.17]
      action_type: stop
      max_points: 2
      visualize: true
      polygon_pub_topic: rvclaw/collision_monitor/front_stop
      enabled: true
    front_slow:
      type: polygon
      points: [0.0, 0.23, 0.55, 0.23, 0.55, -0.23, 0.0, -0.23]
      action_type: slowdown
      max_points: 2
      slowdown_ratio: 0.4
      visualize: true
      polygon_pub_topic: rvclaw/collision_monitor/front_slow
      enabled: true
    side_near_stop:
      type: polygon
      points: [0.0, 0.13725, 0.35, 0.13725, 0.35, -0.13725, 0.0, -0.13725]
      action_type: stop
      max_points: 2
      visualize: true
      polygon_pub_topic: rvclaw/collision_monitor/side_near_stop
      enabled: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 500

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.20, 0.0, 0.60]
    min_velocity: [-0.03, 0.0, -0.60]
    max_accel: [0.20, 0.0, 0.60]
    max_decel: [-0.20, 0.0, -0.60]
    odom_topic: /odom
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25
