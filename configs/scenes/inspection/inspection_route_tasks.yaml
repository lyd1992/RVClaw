schema_version: 2
vision_api_url: http://127.0.0.1:8017
result_root: /data/RVClaw/runs/route-inspections
restore_camera_mode: true
speech_ack_timeout_s: 22.0

defaults:
  enabled: true
  task_id: inspect_meter
  kind: digital_meter
  search_offsets_deg: [0, -5, 5]
  reads_per_heading: 3
  min_consistent_reads: 2
  min_confidence: 0.65
  numeric_tolerance: 0.01
  timeout_s: 60.0
  failure_policy: continue

# Targets approximate the mapped obstacle faces bearing the printed meters.
# Navigation stops at the separate free-space waypoints in waypoints.yaml.
# Camera heading is derived from the vector waypoint -> target, not from a
# stale arrival yaw.  Field validation must confirm actual sticker alignment.
points:
  A:
    meter_id: PRINT-A
    kind: digital_meter
    min_consistent_reads: 2
    raw_text_pattern: '^[0-9]{2}\.[0-9]{2}$'
    normal_max: 50
    normal_max_inclusive: true
    target: {x_m: 2.0, y_m: 1.35}
  B:
    meter_id: PRINT-B
    kind: digital_meter
    min_consistent_reads: 2
    reads_per_heading: 4
    raw_text_pattern: '^[0-9]{5}$'
    normal_max: 99999
    normal_max_inclusive: false
    target: {x_m: 5.8, y_m: -0.10}
  C:
    meter_id: PRINT-C
    kind: pointer_meter
    calibration:
      zero_angle_deg: 270
      sweep_deg: 360
      min_value: 0
      max_value: 100
      direction: clockwise
      decimal_places: 2
    normal_min: 60
    normal_min_inclusive: true
    numeric_tolerance: 2.0
    reads_per_heading: 4
    # Keep the operator's +Y observation direction. Stop-position estimates
    # must not turn a fixed heading into a repeatedly changing close bearing.
    search_offsets_deg: [0, -20, 20]
    inspection_yaw_deg: 90.0
